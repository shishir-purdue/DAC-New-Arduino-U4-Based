[platformio]
default_envs = uno_r4_minima
src_dir = Software/src
lib_dir = Software/lib

[env:uno_r4_minima]
platform = renesas-ra@1.9.0
board = uno_r4_minima
framework = arduino
; Ethernet 2.0.2 is vendored in Software/lib/Ethernet with bounded waits
; and cancellation hooks required by the physical recovery buttons.
monitor_speed = 115200
upload_protocol = dfu
