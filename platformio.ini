[platformio]
default_envs = uno_r4_minima
src_dir = Software/src
lib_dir = Software/lib

[env:uno_r4_minima]
platform = renesas-ra@1.9.0
board = uno_r4_minima
framework = arduino
platform_packages =
    framework-arduinorenesas-uno@1.6.0
    toolchain-gccarmnoneeabi@1.70201.0
    tool-dfuutil-arduino@1.11.0
; Ethernet 2.0.2 is vendored in Software/lib/Ethernet with bounded waits
; and cancellation hooks required by the physical recovery buttons.
monitor_speed = 115200
upload_protocol = dfu

; Opt-in USB action emulation for an isolated test bench. The normal build above
; has no serial control interface. Physical buttons stay active in both builds.
[env:uno_r4_minima_bench]
extends = env:uno_r4_minima
build_flags = -DDAC_BENCH_CONTROLS=1
